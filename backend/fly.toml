# Fly.io — la API del INCES LMS, siempre encendida por ~3,69 $/mes.
#
# **Por qué existe.** Render se queda sin horas (750/mes por workspace) y
# suspende; Cloud Run escala a cero y paga arranque en frío. Fly cobra por
# segundo de máquina encendida, sin techo de horas, y acepta el mismo Dockerfile
# sin tocar una línea de código.
#
# **Por qué 512 MB y no 256.** La máquina más barata (256 MB, 2,19 $/mes) alcanza
# para servir JSON, pero esta API genera **PDF de planilla y certificados en
# memoria**: con 256 MB el proceso muere en la ruta más pesada, y morir por OOM
# en la planilla es peor que pagar 1,50 $ más. 512 MB son 3,69 $/mes.
#
# Despliegue:
#   cd backend
#   fly launch --no-deploy          # solo la primera vez, para crear la app
#   fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... \
#                   SUPABASE_SERVICE_ROLE_KEY=... CORS_ORIGINS=...
#   fly deploy
#
# Las variables NO van aquí: `fly.toml` se versiona y las claves no. Van por
# `fly secrets`, que las cifra y las inyecta como entorno.

app = "inces-lms-api"
primary_region = "mia" # Miami: lo más cerca de Venezuela con máquina disponible

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true

  # **Siempre encendida, y eso es a propósito.** `auto_stop_machines = "off"`
  # con `min_machines_running = 1` es lo que hace que no haya arranque en frío:
  # la máquina no se duerme por inactividad. Es lo que se está pagando.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/salud"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # `shared-cpu-1x` con 512 MB: 3,69 $/mes a 30 días continuos.
  size = "shared-cpu-1x"
  memory = "512mb"
