# INCES LMS — Render Blueprint (ARCHIVADO, NO USAR)
#
# **Estado: histórico desde el 2026-10-31.** El backend de producción vive en
# **Vercel** (`https://inces-lms-api.vercel.app`) por decisión del propietario:
# todo el stack en capas gratuitas, sin tarjeta y sin techo de horas.
#
# Render se retiró porque su plan free da 750 h/mes por workspace (un mes son
# 744 h) y **suspende** el servicio al agotarlas: medido el 2026-10-30 con un
# `503` y `x-render-routing: suspend`.
#
# Este archivo se movió aquí desde la raíz para que ningún `push` pueda
# reactivar un despliegue accidental. La configuración vigente de la API es
# `backend/vercel.json`. Si algún día se volviera a Render, hay que restaurar la
# ruta original a mano y actualizar `docs/ENTORNOS_Y_DESPLIEGUE.md`.
#
# --- contenido original a partir de aquí ---

services:
  - type: web
    name: inces-lms-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://inces-lms.pages.dev
      - key: FRONTEND_URL
        value: https://inces-lms.pages.dev
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: inces-lms-media
      - key: R2_PUT_TTL_SEGUNDOS
        sync: false
      - key: R2_GET_TTL_SEGUNDOS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM
        sync: false
